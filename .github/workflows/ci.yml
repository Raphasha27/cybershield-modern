name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        working-directory: backend
        run: go mod tidy

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        working-directory: backend
        run: CGO_ENABLED=0 go build -o ../bin/cybershield-server ./cmd/server

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cybershield-soc ./backend

  rust-analyzer:
    name: Rust Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Test
        working-directory: tools/threat-analyzer
        run: cargo test

      - name: Clippy
        working-directory: tools/threat-analyzer
        run: cargo clippy -- -D warnings
